version: "3.8"

services:
  database:
    build: ./database-service
    container_name: database-service
    environment:
      POSTGRES_DB: devops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: devops_db
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      database:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3002:3002"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: devops_db
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend-service
    container_name: frontend-service
    ports:
      - "5000:5000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
    depends_on:
      - product-service
      - order-service

volumes:
  pgdata:
